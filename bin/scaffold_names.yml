# Method names for operations where Paystack's own name would be a worse Ruby name than the one this
# SDK has always used, or would clash with Ruby. Keyed by the operation as the spec writes it.
#
# Names not listed here come from the operation's summary ("Create Subaccount" becomes `create`).
# bin/paystack-scaffold refuses a name that would shadow one of Ruby's own methods (`initialize`,
# `send`, `format`...) and tells you to add the operation here.
#
# An entry can also be a hash, to give a path variable the Ruby keyword Paystack's docs use where the
# spec names it differently (the wire does not change: path variables are not sent by name):
#
#   "GET /customer/{code}":
#     name: fetch                  # optional; the method name, as above
#     keywords:
#       code: email_or_code        # spec path variable => Ruby keyword
#
# An operation whose body is a JSON array (Initiate Bulk Charge) takes it as one keyword, `items`
# unless the entry's `body` names another:
#
#   "POST /bulkcharge":
#     body: charges

# "Initialize Transaction": `initialize` would replace the constructor.
"POST /transaction/initialize": initiate
"GET /transaction/totals": totals
"GET /transaction/timeline/{id}": timeline

# "Initiate Transfer"
"POST /transfer": create

# "Validate Bank Account"
"POST /bank/validate": validate_account

# "List States (AVS)"
"GET /address_verification/states": list_states

# "Fetch Customer": the docs name the path variable email_or_code; it takes an email or a customer code.
"GET /customer/{code}":
  name: fetch
  keywords:
    code: email_or_code

# "Initiate Bulk Transfer": the bulk form of `create`.
"POST /transfer/bulk": bulk_create
# The docs call these "Disable OTP", "Finalize Disable OTP" and "Enable OTP"; the paths agree.
"POST /transfer/disable_otp_finalize": finalize_disable_otp
"POST /transfer/enable_otp": enable_otp

# "Retry Refund": `retry` is a Ruby keyword. The path names what it does: retry with customer details.
"POST /refund/retry_with_customer_details/{id}": retry_with_customer_details

# "Fetch Settlement Transactions": the docs call it "List Settlement Transactions"; the SDK method is `transactions`.
"GET /settlement/{id}/transactions": transactions

# "Fetch Subaccount" and "Update Subaccount": the docs name the path variable id_or_code (subaccount ID or code).
"GET /subaccount/{code}":
  keywords:
    code: id_or_code
"PUT /subaccount/{code}":
  keywords:
    code: id_or_code

# "Fetch Balance Ledger": the docs call it "Fetch Balance Ledger"; the SDK method is `ledger` (Balances#ledger).
"GET /balance/ledger": ledger

# "Fetch Plan" and "Update Plan": the docs name the path variable id_or_code (plan ID or code).
"GET /plan/{code}":
  keywords:
    code: id_or_code
"PUT /plan/{code}":
  keywords:
    code: id_or_code

# "Fetch Subscription": the docs name the path variable id_or_code; Paystack takes the subscription ID or code.
"GET /subscription/{code}":
  keywords:
    code: id_or_code

# "Fetch Dedicated Account" and "Deactivate Dedicated Account": the docs name the path variable dedicated_account_id.
"GET /dedicated_account/{id}":
  keywords:
    id: dedicated_account_id
"DELETE /dedicated_account/{id}":
  keywords:
    id: dedicated_account_id
# "Split Dedicated Account Transaction": it adds a split to an account (docs anchor #add-split); the pair of remove_split.
"POST /dedicated_account/split": add_split

# Payment Requests. The docs name the path variable id_or_code where the API takes the numeric ID or
# the PRQ_ code (Fetch, Update, Finalize and Archive all accept both on the test API), and code on
# Verify (only the code works) and Send Notification (not called live: it emails the customer).
"GET /paymentrequest/{id}":
  keywords:
    id: id_or_code
"PUT /paymentrequest/{id}":
  keywords:
    id: id_or_code
"GET /paymentrequest/verify/{id}":
  keywords:
    id: code
# "Send Notification": `send_notification` is also a keyword on create and finalize; the path says notify.
"POST /paymentrequest/notify/{id}":
  name: notify
  keywords:
    id: code
# "Payment Request Total": `totals`, as on Transactions.
"GET /paymentrequest/totals": totals
"POST /paymentrequest/finalize/{id}":
  keywords:
    id: id_or_code
"POST /paymentrequest/archive/{id}":
  keywords:
    id: id_or_code

# Pages. The docs name the path variable id_or_slug on Fetch and Update (both accept the numeric ID
# or the slug on the test API) and id on Add Products (the ID only).
"GET /page/{id}":
  keywords:
    id: id_or_slug
"PUT /page/{id}":
  keywords:
    id: id_or_slug

# Orders: Paystack names the operation "Fetch Product Orders"; the scaffold would drop the last word.
"GET /order/product/{id}": fetch_product_orders

# "Publish Storefront": it copies the storefront and its products into LIVE mode, even with a test key
# (seen on the test API, 2026-10-09: the response says "Storefront published to live" and the copy
# is a live, active storefront that a test key cannot read or delete).
"POST /storefront/{id}/publish":
  note: "Publishing copies the storefront and its products into LIVE mode, even when you call it with a test key (sk_test_). The live copy is active, can be found by its slug, and cannot be read or deleted with a test key. Do not call this to try the API out; use `duplicate` instead."

# "Initiate Bulk Charge": the body is a JSON array of charges, taken as `charges:`.
"POST /bulkcharge":
  body: charges
# "Fetch Bulk Charge Batch": the docs name the path variable id_or_code (batch ID or code).
"GET /bulkcharge/{code}":
  keywords:
    code: id_or_code
# "List Charges in a Batch": the docs call it "Fetch Charges in a Batch"; `list_in_a_batch` reads badly.
"GET /bulkcharge/{code}/charges":
  name: fetch_charges
  keywords:
    code: id_or_code
# "Pause/Resume Bulk Charge Batch": the docs name the path variable batch_code.
"GET /bulkcharge/pause/{code}":
  keywords:
    code: batch_code
"GET /bulkcharge/resume/{code}":
  keywords:
    code: batch_code

# Apple Pay domains: registering or unregistering changes the account's Apple Pay domain configuration,
# which is account-wide and public. Neither was called live while this resource was built (only the list
# was), so both are described from the spec and docs only.
"POST /apple-pay/domain":
  note: "Registers a domain for Apple Pay on the whole account. This changes Apple Pay configuration that may also affect live mode, even with a test key (sk_test_). Not verified against the live API by this SDK: do not call it to try the API out."
"DELETE /apple-pay/domain":
  note: "Unregisters a domain from Apple Pay on the whole account. This changes Apple Pay configuration that may also affect live mode, even with a test key (sk_test_). Not verified against the live API by this SDK, including how Paystack reads the request body of a DELETE."

# "Update Payment Session Timeout": an account-wide setting. Not called live while building this (it may be
# shared with LIVE mode), so its behaviour is described from the spec and docs only.
"PUT /integration/payment_session_timeout":
  note: "Changes the payment session timeout of the whole integration (account-wide), and the setting may be shared with LIVE mode even when you call it with a test key (sk_test_). It has not been verified against the live API. Read the current value with `fetch_payment_session_timeout` first, and do not call this to try the API out."

# Direct Debit (integration-wide). Not the same endpoints as the Customer
# ones under /customer/{id}/directdebit-*.
"PUT /directdebit/activation-charge":
  note: "Charges the bank accounts behind the given customers' pending mandates to activate them; in live mode this moves real money. It was not called against the test API while this method was built, so its behaviour is documented, not verified. For one customer's inactive mandate, `customers.direct_debit_activation_charge` takes an `authorization_id` instead."

# Terminals. The docs name Send Event's path variable terminal_id, as the other operations do; the
# spec calls it id. Send Event and Commission/Decommission act on a physical device, so they were not
# called while building this (the test account returns 403 "not yet available in your country" for
# every Terminal endpoint, 2026-10-09).
"POST /terminal/{id}/event":
  keywords:
    id: terminal_id
  note: "This pushes the event to a physical Paystack Terminal. Not verified against the Paystack API: the test account used to build this SDK has no Terminal access."
"POST /terminal/commission_device":
  note: "This links a physical device to your integration. Not verified against the Paystack API: the test account used to build this SDK has no Terminal access."
"POST /terminal/decommission_device":
  note: "This unlinks a physical device from your integration. Not verified against the Paystack API: the test account used to build this SDK has no Terminal access."
