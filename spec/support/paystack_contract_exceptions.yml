# Places where what the SDK sends deliberately differs from Paystack's OpenAPI spec.
#
# The spec is the default authority, but it can disagree with Paystack's canonical docs
# (https://paystack.com/docs/api/). Where the docs are right, the request follows the docs and the
# difference is recorded here, with its source, so every deviation is deliberate and reviewable.
#
# Each entry:
#   operation: "METHOD /path"  as written in the spec
#   in:        query | body
#   wire:      the name the SDK sends (as the canonical docs name it)
#   spec:      the name the OpenAPI spec uses for the same parameter; null when the spec omits it
#              (a docs-only parameter, which also needs `type` and `description`)
#   type:      optional; the type to check the value against when the docs and spec disagree on it
#   required:  optional; true when the docs and the API require a parameter the spec marks optional,
#              false (body fields only) when the API accepts a request without one the spec marks required
#   enum:      optional; the allowed values, when the API accepts a different list than the spec's
#   ruby:      optional; the idiomatic Ruby keyword when it is not just the snake_case of `wire`
#   reason / docs: why, and where it was confirmed
#
# Never add an entry from the spec or the docs mirror alone: confirm it on the canonical page.

- operation: "GET /transaction"
  in: query
  wire: perPage
  spec: per_page
  reason: Canonical docs list perPage on List Transactions; the spec says per_page.
  docs: https://paystack.com/docs/api/transaction/#list

- operation: "GET /transaction"
  in: query
  wire: customer
  spec: customer_code
  type: integer
  ruby: customer_id
  reason: Canonical docs list customer as an integer customer ID; the spec says customer_code, a string. The Ruby keyword is customer_id because it takes the numeric ID, not a CUS_ code.
  docs: https://paystack.com/docs/api/transaction/#list

- operation: "GET /transaction/export"
  in: query
  wire: customer
  spec: customer
  ruby: customer_id
  reason: Naming only. The wire name matches the spec; the Ruby keyword is customer_id for consistency with List Transactions, since the value is the numeric customer ID.
  docs: https://paystack.com/docs/api/transaction/#export

- operation: "GET /transaction"
  in: query
  wire: terminalid
  spec: terminal_id
  ruby: terminal_id
  reason: Canonical docs list terminalid; the spec says terminal_id.
  docs: https://paystack.com/docs/api/transaction/#list

- operation: "GET /transferrecipient"
  in: query
  wire: perPage
  spec: per_page
  reason: Canonical docs list perPage on List Transfer Recipients; the spec says per_page. Both names change the page size on the Paystack test API (confirmed 2026-10-09 with three recipients, perPage=1 and per_page=1 each returned one record and pageCount 3), so the docs name is sent.
  docs: https://paystack.com/docs/api/transfer-recipient/#list

- operation: "GET /transfer"
  in: query
  wire: perPage
  spec: per_page
  reason: Canonical docs list perPage on List Transfers; the spec says per_page.
  docs: https://paystack.com/docs/api/transfer/#list

- operation: "GET /transfer"
  in: query
  wire: recipient
  spec: recipient
  type: integer
  reason: Canonical docs list recipient as an integer recipient ID; the spec describes a recipient code.
  docs: https://paystack.com/docs/api/transfer/#list

- operation: "GET /transaction/export"
  in: query
  wire: currency
  spec: null
  type: string
  description: Specify the transaction currency to export.
  reason: Listed on the canonical Export Transactions section but absent from the spec. Confirmed against the Paystack test API on 2026-10-08, where it changes the exported rows.
  docs: https://paystack.com/docs/api/transaction/#export

- operation: "GET /transaction/export"
  in: query
  wire: amount
  spec: null
  type: integer
  description: Filter transactions by amount, using the supported currency subunit.
  reason: Listed on the canonical Export Transactions section but absent from the spec. Confirmed against the Paystack test API on 2026-10-08, where it changes the exported rows.
  docs: https://paystack.com/docs/api/transaction/#export

- operation: "GET /transaction/export"
  in: query
  wire: settled
  spec: null
  type: boolean
  description: Set to true to export only settled transactions, false for pending transactions. Leave undefined to export all transactions.
  reason: Listed on the canonical Export Transactions section but absent from the spec. Confirmed against the Paystack test API on 2026-10-08, where it changes the exported rows.
  docs: https://paystack.com/docs/api/transaction/#export

- operation: "GET /transaction/export"
  in: query
  wire: payment_page
  spec: null
  type: integer
  description: Specify a payment page's id to export only transactions conducted on said page.
  reason: Listed on the canonical Export Transactions section but absent from the spec. Confirmed against the Paystack test API on 2026-10-08, where it changes the exported rows.
  docs: https://paystack.com/docs/api/transaction/#export

- operation: "GET /bank"
  in: query
  wire: type
  spec: type
  enum: [ghipss, mobile_money, nuban, kepss, basa]
  reason: The spec lists the Ghana bank channel as ghipps, which is a typo. The canonical List Banks section says ghipss. Confirmed against the Paystack test API on 2026-10-09 with country=ghana&perPage=1, where type=ghipss returns banks and type=ghipps returns an empty list. kepss was checked the same way (kepss returns banks for Kenya, kepps returns none).
  docs: https://paystack.com/docs/api/miscellaneous/#bank

- operation: "GET /bank/resolve"
  in: query
  wire: account_number
  spec: account_number
  type: string
  required: true
  reason: The docs say account_number is a required string; the spec says an optional integer. An integer would lose the leading zero that account numbers carry. Confirmed against the Paystack test API on 2026-10-09, where omitting it returns 400 "account_number is required", and 0022728151 is read as a different account number from 22728151 (the latter returns 400 "Account number is invalid").
  docs: https://paystack.com/docs/api/verification/#resolve-account

- operation: "GET /bank/resolve"
  in: query
  wire: bank_code
  spec: bank_code
  type: string
  required: true
  reason: The docs say bank_code is a required string; the spec says an optional integer. Bank codes carry leading zeros (063). Confirmed against the Paystack test API on 2026-10-09, where omitting it returns 400 "bank_code is required".
  docs: https://paystack.com/docs/api/verification/#resolve-account

- operation: "GET /decision/bin/{bin}"
  in: path
  wire: bin
  spec: bin
  type: string
  reason: The docs say bin is a string; the spec says an integer. Confirmed against the Paystack test API on 2026-10-09, where /decision/bin/539983 resolves and a non-numeric value returns 400 "Bin must be 6 or 8 digits". A string keeps leading zeros.
  docs: https://paystack.com/docs/api/verification/#resolve-card

- operation: "GET /address_verification/states"
  in: query
  wire: country
  spec: country
  required: true
  reason: The docs mark country required; the spec marks it optional. Confirmed against the Paystack test API on 2026-10-09, where omitting it returns 422 "Country is required".
  docs: https://paystack.com/docs/api/miscellaneous/#avs-states

- operation: "GET /bank"
  in: query
  wire: currency
  spec: currency
  enum: [GHS, KES, NGN, ZAR, USD]
  reason: The spec lists four currencies; the SDK has always accepted USD as well. Confirmed against the Paystack test API on 2026-10-09, where currency=USD&country=ghana&perPage=1 returns a USD bank (Absa Bank Ghana Limited) while currency=XXX returns an empty list. The docs only say "one of the supported currency".
  docs: https://paystack.com/docs/api/miscellaneous/#bank

- operation: "POST /charge"
  in: body
  wire: currency
  spec: null
  type: string
  description: The currency to charge in (GHS, KES and so on); Paystack uses your integration's currency when it is left out.
  reason: Sent in the Mobile Money, M-PESA and EFT examples of Paystack's payment channels guide; absent from the spec and from the Create Charge parameter table. Confirmed against the Paystack test API on 2026-10-09 (a GHS integration), where a mobile_money charge with currency GHS succeeds and the same charge with KES or XYZ is refused with "Invalid provider".
  docs: https://paystack.com/docs/payments/payment-channels/#mobile-money

- operation: "POST /charge"
  in: body
  wire: split_code
  spec: null
  type: string
  description: The split code (SPL_...) of a previously created split.
  reason: Listed on the canonical Create Charge section but absent from the spec. Confirmed against the Paystack test API on 2026-10-09, where an unknown split code is refused with 404 "Invalid Split code.".
  docs: https://paystack.com/docs/api/charge/#create

- operation: "POST /charge"
  in: body
  wire: subaccount
  spec: null
  type: string
  description: The code (ACCT_...) of the subaccount that owns the payment.
  reason: Listed on the canonical Create Charge section but absent from the spec. Confirmed against the Paystack test API on 2026-10-09, where an unknown subaccount code is refused with 404 "Invalid Subaccount.".
  docs: https://paystack.com/docs/api/charge/#create

- operation: "POST /charge"
  in: body
  wire: bank_transfer
  spec: null
  type: object
  description: Settings for the Pay with Transfer and Pesalink channel (account_expires_at, the expiry time of the account).
  reason: Listed on the canonical Create Charge section but absent from the spec. Confirmed against the Paystack test API on 2026-10-09, where a charge with only a bank_transfer object returns status pending_bank_transfer (with no channel object at all, Paystack refuses the charge).
  docs: https://paystack.com/docs/api/charge/#create

- operation: "POST /charge"
  in: body
  wire: qr
  spec: null
  type: object
  description: The QR provider details (provider, scan-to-pay being the only one); South Africa only.
  reason: Listed on the canonical Create Charge section but absent from the spec. Confirmed against the Paystack test API on 2026-10-09, where a charge with only a qr object is attempted ("scan-to-pay QR payment not supported for this transaction" on a GHS integration) instead of being refused for lacking a channel object.
  docs: https://paystack.com/docs/api/charge/#create

- operation: "POST /charge"
  in: body
  wire: capitec_pay
  spec: null
  type: object
  description: The Capitec Pay account holder (identifier_key, one of CELLPHONE, IDNUMBER or ACCOUNTNUMBER, and identifier_value); South Africa only.
  reason: Listed on the canonical Create Charge section but absent from the spec. Confirmed against the Paystack test API on 2026-10-09, where a charge with only a capitec_pay object is refused with "Integration is not eligible for Capitec Pay" instead of for lacking a channel object.
  docs: https://paystack.com/docs/api/charge/#create

- operation: "GET /customer"
  in: query
  wire: perPage
  spec: perPage
  type: integer
  reason: Type only. Canonical docs list perPage as an Integer; the spec types it as a string. Confirmed against the Paystack test API on 2026-10-09, where perPage=2 returns two customers and meta.perPage 2.
  docs: https://paystack.com/docs/api/customer/#list

- operation: "GET /customer"
  in: query
  wire: page
  spec: page
  type: integer
  reason: Type only. Canonical docs list page as an Integer; the spec types it as a string. Confirmed against the Paystack test API on 2026-10-09, where page=2 returns the next set and meta.page 2.
  docs: https://paystack.com/docs/api/customer/#list

- operation: "POST /customer"
  in: body
  wire: metadata
  spec: metadata
  type: object
  description: A set of key/value pairs that you can attach to the customer.
  reason: Canonical docs list metadata as an Object; the spec says stringified JSON. Confirmed against the Paystack test API on 2026-10-09, which rejects a JSON string with 400 "\"metadata\" must be of type object" and stores an object as given.
  docs: https://paystack.com/docs/api/customer/#create

- operation: "PUT /customer/{code}"
  in: body
  wire: metadata
  spec: metadata
  type: object
  description: A set of key/value pairs that you can attach to the customer.
  reason: Canonical docs list metadata as an Object; the spec says stringified JSON. Confirmed against the Paystack test API on 2026-10-09, which rejects a JSON string with 400 "\"metadata\" must be of type object".
  docs: https://paystack.com/docs/api/customer/#update

- operation: "POST /refund"
  in: body
  wire: transaction
  spec: transaction
  description: The reference or ID of a previously completed transaction.
  reason: The spec says transaction is a reference string; the canonical Create Refund section says "Transaction reference or id" and its cURL sample sends an integer. Confirmed against the Paystack test API on 2026-10-09, where a reference, a numeric ID sent as a JSON integer and the same ID sent as a string all resolve the transaction (400 "Refund amount exceeds transaction amount" for an over-limit amount, against 400 "Transaction not found" for unknown values), and a full refund created with {"transaction":<integer id>} succeeded.
  docs: https://paystack.com/docs/api/refund/#create

- operation: "GET /refund"
  in: query
  wire: transaction
  spec: null
  type: integer
  ruby: transaction_id
  description: The ID of the refunded transaction.
  reason: Listed on the canonical List Refunds section ("The transaction ID of the refunded transaction") but absent from the spec. Confirmed against the Paystack test API on 2026-10-09 with refunds on two transactions, where transaction=<id> returned only that transaction's refund and transaction=<reference> returned none. The Ruby keyword is transaction_id because it takes the numeric ID, not a reference.
  docs: https://paystack.com/docs/api/refund/#list

- operation: "GET /settlement"
  in: query
  wire: from
  spec: null
  type: string
  description: A timestamp from which to start listing settlements, for example 2016-09-24T00:00:05.000Z or 2016-09-21.
  reason: Listed on the Settlements List section of the docs (via the docs mirror) but absent from the spec. Confirmed against the Paystack test API on 2026-10-09, which answers an invalid value with 400 "Invalid 'from' date passed" and accepts 2016-09-21, 2016-09-24T00:00:05.000Z and 2016-09-24T00:00:05Z. The test account has no settlements, so the filtering itself could not be observed.
  docs: https://paystack.com/docs/api/settlement/#list

- operation: "GET /settlement"
  in: query
  wire: to
  spec: null
  type: string
  description: A timestamp at which to stop listing settlements, for example 2016-09-24T00:00:05.000Z or 2016-09-21.
  reason: Listed on the Settlements List section of the docs (via the docs mirror) but absent from the spec. Confirmed against the Paystack test API on 2026-10-09, which answers an invalid value with 400 "Invalid 'to' date passed". The test account has no settlements, so the filtering itself could not be observed.
  docs: https://paystack.com/docs/api/settlement/#list

- operation: "GET /split"
  in: query
  wire: perPage
  spec: per_page
  reason: Canonical docs list perPage on List Splits; the spec says per_page. Confirmed against the Paystack test API on 2026-10-09 with two splits, where perPage=1 returns one split and meta.perPage 1, while per_page=1 is ignored (both splits, meta.perPage 50).
  docs: https://paystack.com/docs/api/split/#list

- operation: "GET /split/{id}"
  in: path
  wire: id
  spec: id
  type: string
  reason: The docs say id is a string; the spec says an integer. Confirmed against the Paystack test API on 2026-10-09, where /split/<numeric id> and /split/<split code> (SPL_...) both return the split. Only Fetch takes a split code; Update returns 500 and Add/Remove Subaccount return 400 "Split ID should be an integer" for one.
  docs: https://paystack.com/docs/api/split/#fetch

- operation: "POST /split/{id}/subaccount/add"
  in: body
  wire: subaccount
  spec: subaccount
  required: true
  reason: The docs list subaccount without "optional"; the spec marks it optional. Confirmed against the Paystack test API on 2026-10-09, where omitting it returns 400 "Please specify subaccount to be added".
  docs: https://paystack.com/docs/api/split/#add-subaccount

- operation: "POST /split/{id}/subaccount/add"
  in: body
  wire: share
  spec: share
  required: true
  reason: The docs list share without "optional"; the spec marks it optional. Confirmed against the Paystack test API on 2026-10-09, where omitting it returns 400 "You have invalid or missing subaccount(s) key".
  docs: https://paystack.com/docs/api/split/#add-subaccount

- operation: "POST /split/{id}/subaccount/remove"
  in: body
  wire: subaccount
  spec: subaccount
  required: true
  reason: The docs list subaccount without "optional"; the spec marks it optional. Confirmed against the Paystack test API on 2026-10-09, where omitting it returns 400 "Please specify subaccount to be removed".
  docs: https://paystack.com/docs/api/split/#remove-subaccount

- operation: "POST /split/{id}/subaccount/remove"
  in: body
  wire: share
  spec: share
  description: Not used when removing a subaccount; the docs do not list it, and Paystack removes the subaccount whatever share is sent.
  reason: Description only. The spec copies share from Add Subaccount; the docs list only subaccount. Confirmed against the Paystack test API on 2026-10-09, where removing a subaccount whose share was 30 with share 999 still returns "Subaccount removed".
  docs: https://paystack.com/docs/api/split/#remove-subaccount

- operation: "GET /dispute/{id}/upload_url"
  in: query
  wire: upload_filename
  spec: null
  type: string
  description: The file name, with its extension, that you want to upload (for example filename.pdf).
  reason: Listed on the canonical Get Upload URL section but absent from the spec. Confirmed against the Paystack test API on 2026-10-09, where it changes the response (upload_filename=a.pdf returned a signedUrl and fileName ending in .pdf; without it the file name has no extension).
  docs: https://paystack.com/docs/api/dispute/#upload-url

- operation: "POST /subaccount"
  in: body
  wire: bank_code
  spec: settlement_bank
  description: Bank code for the bank, from the List Banks endpoint.
  reason: The canonical Create Subaccount parameter table names the field bank_code; the spec (and the docs' cURL sample) say settlement_bank. Confirmed against the Paystack test API on 2026-10-09 (a GHS integration) that both names are read as the bank code, and bank_code is the one Paystack uses when both are sent (bank_code MTN with settlement_bank XYZ creates the subaccount; the reverse is refused with "Settlement Bank is invalid"). With neither, the API answers 400 "Bank code is required".
  docs: https://paystack.com/docs/api/subaccount/#create

- operation: "POST /subaccount"
  in: body
  wire: percentage_charge
  spec: percentage_charge
  description: The percentage the main account receives from each payment made to the subaccount.
  reason: Description only; the spec describes percentage_charge as "Customer's phone number" (a copy-paste error). The description is the canonical Create Subaccount section's. The name and type agree. On the Paystack test API (2026-10-09) 0 is accepted and 100.5 is refused with 400 "Percentage charge must be greater than 0 and less than 100".
  docs: https://paystack.com/docs/api/subaccount/#create

- operation: "PUT /subaccount/{code}"
  in: body
  wire: bank_code
  spec: settlement_bank
  description: Bank code for the bank, from the List Banks endpoint.
  reason: The canonical Update Subaccount parameter table names the field bank_code; the spec says settlement_bank. Confirmed against the Paystack test API on 2026-10-09 that both names are read as the bank code and bank_code wins when both are sent (bank_code MTN with settlement_bank XYZ updates; the reverse fails). Either one needs account_number with it ("Account number and Bank code are required").
  docs: https://paystack.com/docs/api/subaccount/#update

- operation: "PUT /subaccount/{code}"
  in: body
  wire: percentage_charge
  spec: percentage_charge
  description: The default percentage charged when receiving on behalf of this subaccount.
  reason: Description only; the spec describes percentage_charge as "Customer's phone number" (a copy-paste error). The description is the canonical Update Subaccount section's. On the Paystack test API (2026-10-09) 0, 0.5, 99.99 and 100 are accepted and 100.01 is refused with 400 "Invalid percentage charge. It should be a number from 0 to 100".
  docs: https://paystack.com/docs/api/subaccount/#update

- operation: "GET /subaccount"
  in: query
  wire: active
  spec: active
  type: integer
  reason: The spec types active as a boolean; the docs do not list it. Confirmed against the Paystack test API on 2026-10-09 with three inactive and four active subaccounts, where active=1 returns the four active ones and active=0 the three inactive ones, but active=true also returns the three inactive ones (any value other than 1 is read as inactive). The SDK sends 1 or 0.
  docs: https://paystack.com/docs/api/subaccount/#list

- operation: "POST /plan"
  in: body
  wire: interval
  spec: interval
  enum: [hourly, daily, weekly, monthly, quarterly, biannually, annually]
  reason: The spec lists daily, weekly, monthly, biannually and annually; the canonical Update Plan section also lists hourly and quarterly, and Create Plan lists quarterly. Confirmed against the Paystack test API on 2026-10-09 that all seven values are accepted by Create Plan (each passed the interval check and reached the amount check; fortnightly and Monthly answer 400 "Invalid interval selected", so the value is case-sensitive), and a plan was created with quarterly. Create Plan's docs omit hourly but the API accepts it.
  docs: https://paystack.com/docs/api/plan/#create

- operation: "PUT /plan/{code}"
  in: body
  wire: interval
  spec: interval
  enum: [hourly, daily, weekly, monthly, quarterly, biannually, annually]
  reason: The spec lists daily, weekly, monthly, biannually and annually; the canonical Update Plan section also lists hourly and quarterly. Confirmed against the Paystack test API on 2026-10-09 that hourly is accepted on update (200 "Plan updated") and fortnightly is refused with 400 "Invalid interval selected".
  docs: https://paystack.com/docs/api/plan/#update

- operation: "PUT /plan/{code}"
  in: body
  wire: description
  spec: description
  type: string
  reason: The spec types description as a boolean on Update Plan (a copy-paste error); the canonical docs say string. Confirmed against the Paystack test API on 2026-10-09 that true is refused with 400 "\"description\" must be a string" and a string updates the plan.
  docs: https://paystack.com/docs/api/plan/#update

- operation: "PUT /plan/{code}"
  in: body
  wire: update_existing_subscriptions
  spec: null
  type: boolean
  description: Set to true if you want the existing subscriptions to use the new changes. Set to false and only new subscriptions will be changed. Defaults to true when not set.
  reason: Listed on the canonical Update Plan section but absent from the spec. Confirmed against the Paystack test API on 2026-10-09 that it is read as a boolean ("abc" is refused with 400 "\"update_existing_subscriptions\" must be a boolean"). Its effect on existing subscriptions was not exercised, because the test plan had none; the docs say it defaults to true.
  docs: https://paystack.com/docs/api/plan/#update

- operation: "GET /plan"
  in: query
  wire: status
  spec: null
  type: string
  description: Filter list by plans with specified status.
  reason: Listed on the canonical List Plans section but absent from the spec. Confirmed against the Paystack test API on 2026-10-09 that it changes results (status=bogus, archived, complete and Active return no plans, while active and inactive each returned all three plans on the account), but which statuses Paystack defines was not settled, so no enum is enforced.
  docs: https://paystack.com/docs/api/plan/#list

- operation: "GET /plan"
  in: query
  wire: interval
  spec: interval
  enum: [hourly, daily, weekly, monthly, quarterly, biannually, annually]
  reason: The spec lists daily, weekly, monthly, biannually and annually for the interval filter. Confirmed against the Paystack test API on 2026-10-09 that interval=hourly filters (it returned exactly the one plan whose interval was hourly at the time) and interval=bogus returns no plans, so the filter takes the same seven values Create and Update Plan accept.
  docs: https://paystack.com/docs/api/plan/#list

- operation: "GET /subscription"

- operation: "POST /paymentrequest"
  in: body
  wire: amount
  spec: amount
  required: false
  description: The amount in the subunit. Leave it out when you send line_items or tax; Paystack adds those up.
  reason: The spec marks amount required; the docs say it is for when line items and tax are not given, and their own cURL sample sends none. Confirmed against the Paystack test API on 2026-10-09, where a request with line_items [{amount 2000, quantity 2}] and tax [{amount 300}] and no amount was created with amount 4300, a draft with neither was created with amount 0, and a non-draft with neither returned 400 "Amount was not passed or could not be extrapolated from line items."
  docs: https://paystack.com/docs/api/payment-request/#create

- operation: "POST /paymentrequest"
  in: body
  wire: line_items
  spec: line_items
  description: 'Line items, each a Hash such as {name: "item 1", amount: 2000, quantity: 1} (amount in the subunit).'
  reason: Description only. The docs call it an "Array of Strings" but show objects; the spec says an array of objects. Confirmed against the Paystack test API on 2026-10-09, where [{"name":"item 1","amount":2000,"quantity":2}] is stored as given and counts 4000 towards the amount.
  docs: https://paystack.com/docs/api/payment-request/#create

- operation: "POST /paymentrequest"
  in: body
  wire: tax
  spec: tax
  description: 'Taxes, each a Hash such as {name: "VAT", amount: 2000} (amount in the subunit).'
  reason: Description only. The docs call it an "Array of Strings" but show objects; the spec says an array of objects. Confirmed against the Paystack test API on 2026-10-09, where [{"name":"VAT","amount":300}] is stored as given and added to the amount.
  docs: https://paystack.com/docs/api/payment-request/#create

- operation: "POST /paymentrequest"
  in: body
  wire: due_date
  spec: due_date
  type: string
  description: ISO 8601 date or date-time the request is due, for example 2026-12-31 or 2026-12-31T23:00:00Z.
  reason: The spec requires a date-time; the docs' own sample sends a date (2020-07-08). Confirmed against the Paystack test API on 2026-10-09, where 2026-12-31 (stored as 2026-12-31T00:00:00.000Z) and 2026-12-31T23:00:00Z are accepted and 31/12/2026 is refused with 400 "Due date is not in a valid format. Please pass a valid ISO 8601 string".
  docs: https://paystack.com/docs/api/payment-request/#create

- operation: "POST /paymentrequest"
  in: body
  wire: metadata
  spec: null
  type: object
  description: A Hash of custom data, stored on the payment request.
  reason: Listed on the docs' Create Payment Request section (as "Stringified JSON") but absent from the spec. Confirmed against the Paystack test API on 2026-10-09, where a JSON string is refused with 400 '"metadata" must be of type object' and {"probe":"a"} is stored and returned as metadata.
  docs: https://paystack.com/docs/api/payment-request/#create

- operation: "POST /paymentrequest"
  in: body
  wire: redirect_url
  spec: null
  type: string
  description: A URL for Paystack to redirect to after a successful payment.
  reason: Listed on the docs' Create Payment Request section but absent from the spec. Confirmed against the Paystack test API on 2026-10-09, where redirect_url https://example.com/done is stored and returned on the payment request (null without it). The redirect itself was not observed (no payment was made).
  docs: https://paystack.com/docs/api/payment-request/#create

- operation: "PUT /paymentrequest/{id}"
  in: body
  wire: line_items
  spec: line_items
  description: 'Line items, each a Hash such as {name: "item 1", amount: 2000, quantity: 1} (amount in the subunit).'
  reason: Description only, as on Create. Confirmed against the Paystack test API on 2026-10-09, where updating a draft with line_items [{amount 1000, quantity 3}] and tax [{amount 50}] set its amount to 3050.
  docs: https://paystack.com/docs/api/payment-request/#update

- operation: "PUT /paymentrequest/{id}"
  in: body
  wire: tax
  spec: tax
  description: 'Taxes, each a Hash such as {name: "VAT", amount: 2000} (amount in the subunit).'
  reason: Description only, as on Create. Confirmed against the Paystack test API on 2026-10-09 (see line_items).
  docs: https://paystack.com/docs/api/payment-request/#update

- operation: "PUT /paymentrequest/{id}"
  in: body
  wire: due_date
  spec: due_date
  type: string
  description: ISO 8601 date or date-time the request is due, for example 2026-12-31 or 2026-12-31T23:00:00Z.
  reason: The spec requires a date-time; the docs' own sample sends a date (2017-05-10). Confirmed against the Paystack test API on 2026-10-09, where 2027-02-01 and 2027-01-15T10:30:00Z are both accepted.
  docs: https://paystack.com/docs/api/payment-request/#update

- operation: "GET /paymentrequest"
  in: query
  wire: customer
  spec: customer
  type: integer
  ruby: customer_id
  reason: The docs list customer as an Integer customer ID; the spec types it as a string. Confirmed against the Paystack test API on 2026-10-09, where customer=<numeric id> returns that customer's subscription and the same customer's code (CUS_...) or email returns none. The Ruby keyword is customer_id because it takes the numeric ID.
  docs: https://paystack.com/docs/api/subscription/#list

- operation: "GET /subscription"
  in: query
  wire: plan
  spec: plan
  ruby: plan_id
  reason: Naming only; the wire name and integer type match the spec. Confirmed against the Paystack test API on 2026-10-09, where plan=<numeric id> returns the plan's subscriptions and the plan's code (PLN_...) returns none. The Ruby keyword is plan_id because it takes the numeric ID, not the plan code that create takes.
  docs: https://paystack.com/docs/api/subscription/#list

  reason: The spec types customer as a string ("Customer ID"). Confirmed against the Paystack test API on 2026-10-09, where customer=<numeric id> returns that customer's three payment requests and customer=<CUS_ code> returns none. The Ruby keyword is customer_id, as on List Transactions, because it takes the numeric ID.
  docs: https://paystack.com/docs/api/payment-request/#list

- operation: "GET /paymentrequest"
  in: query
  wire: include_archive
  spec: null
  type: boolean
  description: Pass true to include archived payment requests. Paystack includes them whenever the parameter is sent, whatever its value, so leave it out (nil) rather than passing false.
  reason: Listed on the docs' List Payment Requests section but absent from the spec. Confirmed against the Paystack test API on 2026-10-09 with two archived and three live requests, where the list without it returns three and include_archive=true, =1 and also =false each return all five.
  docs: https://paystack.com/docs/api/payment-request/#list

- operation: "POST /paymentrequest/finalize/{id}"
  in: body
  wire: send_notification
  spec: null
  type: boolean
  description: Whether Paystack emails the customer; defaults to true.
  reason: Listed on the docs' Finalize Payment Request section ("Defaults to true") but the spec gives Finalize no body. The Paystack test API accepted {"send_notification":false} on 2026-10-09 and finalized the request (by code and by numeric ID) with an empty notifications list. That it suppresses the email was not observed; proving it would mean sending one.
  docs: https://paystack.com/docs/api/payment-request/#finalize

- operation: "GET /paymentrequest/{id}"
  in: path
  wire: id
  spec: id
  type: string
  reason: The docs name the path variable id_or_code, a string; the spec says an integer ID. Confirmed against the Paystack test API on 2026-10-09, where the numeric ID and the PRQ_ code both return the payment request.
  docs: https://paystack.com/docs/api/payment-request/#fetch

- operation: "PUT /paymentrequest/{id}"
  in: path
  wire: id
  spec: id
  type: string
  reason: The docs name the path variable id_or_code, a string; the spec says an integer ID. Confirmed against the Paystack test API on 2026-10-09, where updates by numeric ID and by PRQ_ code both succeed.
  docs: https://paystack.com/docs/api/payment-request/#update

- operation: "GET /paymentrequest/verify/{id}"
  in: path
  wire: id
  spec: id
  type: string
  reason: The docs name the path variable code (Payment Request code); the spec says an integer ID. Confirmed against the Paystack test API on 2026-10-09, where /paymentrequest/verify/<PRQ_ code> returns a finalized request and the numeric ID returns 400 "Slug is invalid" (as does the code of a draft).
  docs: https://paystack.com/docs/api/payment-request/#verify

- operation: "POST /paymentrequest/notify/{id}"
  in: path
  wire: id
  spec: id
  type: string
  reason: The docs name the path variable code, a string (Payment Request code); the spec says an integer ID. Not called on the test API because it emails the customer; every sibling path (fetch, update, verify, finalize, archive) takes the PRQ_ code on the test API (2026-10-09).
  docs: https://paystack.com/docs/api/payment-request/#send-notification

- operation: "POST /paymentrequest/finalize/{id}"
  in: path
  wire: id
  spec: id
  type: string
  reason: The docs' parameter table says code and their cURL sample says id_or_code; the spec says an integer ID. Confirmed against the Paystack test API on 2026-10-09, where finalizing by PRQ_ code and by numeric ID both succeed.
  docs: https://paystack.com/docs/api/payment-request/#finalize

- operation: "POST /paymentrequest/archive/{id}"
  in: path
  wire: id
  spec: id
  type: string
  reason: The docs' parameter table says code and their cURL sample says id_or_code; the spec says an integer ID. Confirmed against the Paystack test API on 2026-10-09, where archiving by PRQ_ code and by numeric ID both return "Payment request has been archived" and an unknown code returns 400 "Payment request code is invalid".
  docs: https://paystack.com/docs/api/payment-request/#archive
