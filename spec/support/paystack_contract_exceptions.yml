# Places where what the SDK sends deliberately differs from Paystack's OpenAPI spec.
#
# The spec is the default authority, but it can disagree with Paystack's canonical docs
# (https://paystack.com/docs/api/). Where the docs are right, the request follows the docs and the
# difference is recorded here, with its source, so every deviation is deliberate and reviewable.
#
# Each entry:
#   operation: "METHOD /path"  as written in the spec
#   in:        query | body
#   wire:      the name the SDK sends (as the canonical docs name it)
#   spec:      the name the OpenAPI spec uses for the same parameter; null when the spec omits it
#              (a docs-only parameter, which also needs `type` and `description`)
#   type:      optional; the type to check the value against when the docs and spec disagree on it
#   required:  optional; true when the docs and the API require a parameter the spec marks optional
#   enum:      optional; the allowed values, when the API accepts a different list than the spec's
#   ruby:      optional; the idiomatic Ruby keyword when it is not just the snake_case of `wire`
#   reason / docs: why, and where it was confirmed
#
# Never add an entry from the spec or the docs mirror alone: confirm it on the canonical page.

- operation: "GET /transaction"
  in: query
  wire: perPage
  spec: per_page
  reason: Canonical docs list perPage on List Transactions; the spec says per_page.
  docs: https://paystack.com/docs/api/transaction/#list

- operation: "GET /transaction"
  in: query
  wire: customer
  spec: customer_code
  type: integer
  ruby: customer_id
  reason: Canonical docs list customer as an integer customer ID; the spec says customer_code, a string. The Ruby keyword is customer_id because it takes the numeric ID, not a CUS_ code.
  docs: https://paystack.com/docs/api/transaction/#list

- operation: "GET /transaction/export"
  in: query
  wire: customer
  spec: customer
  ruby: customer_id
  reason: Naming only. The wire name matches the spec; the Ruby keyword is customer_id for consistency with List Transactions, since the value is the numeric customer ID.
  docs: https://paystack.com/docs/api/transaction/#export

- operation: "GET /transaction"
  in: query
  wire: terminalid
  spec: terminal_id
  ruby: terminal_id
  reason: Canonical docs list terminalid; the spec says terminal_id.
  docs: https://paystack.com/docs/api/transaction/#list

- operation: "GET /transferrecipient"
  in: query
  wire: perPage
  spec: per_page
  reason: Canonical docs list perPage on List Transfer Recipients; the spec says per_page. Both names change the page size on the Paystack test API (confirmed 2026-10-09 with three recipients, perPage=1 and per_page=1 each returned one record and pageCount 3), so the docs name is sent.
  docs: https://paystack.com/docs/api/transfer-recipient/#list

- operation: "GET /transfer"
  in: query
  wire: perPage
  spec: per_page
  reason: Canonical docs list perPage on List Transfers; the spec says per_page.
  docs: https://paystack.com/docs/api/transfer/#list

- operation: "GET /transfer"
  in: query
  wire: recipient
  spec: recipient
  type: integer
  reason: Canonical docs list recipient as an integer recipient ID; the spec describes a recipient code.
  docs: https://paystack.com/docs/api/transfer/#list

- operation: "GET /transaction/export"
  in: query
  wire: currency
  spec: null
  type: string
  description: Specify the transaction currency to export.
  reason: Listed on the canonical Export Transactions section but absent from the spec. Confirmed against the Paystack test API on 2026-10-08, where it changes the exported rows.
  docs: https://paystack.com/docs/api/transaction/#export

- operation: "GET /transaction/export"
  in: query
  wire: amount
  spec: null
  type: integer
  description: Filter transactions by amount, using the supported currency subunit.
  reason: Listed on the canonical Export Transactions section but absent from the spec. Confirmed against the Paystack test API on 2026-10-08, where it changes the exported rows.
  docs: https://paystack.com/docs/api/transaction/#export

- operation: "GET /transaction/export"
  in: query
  wire: settled
  spec: null
  type: boolean
  description: Set to true to export only settled transactions, false for pending transactions. Leave undefined to export all transactions.
  reason: Listed on the canonical Export Transactions section but absent from the spec. Confirmed against the Paystack test API on 2026-10-08, where it changes the exported rows.
  docs: https://paystack.com/docs/api/transaction/#export

- operation: "GET /transaction/export"
  in: query
  wire: payment_page
  spec: null
  type: integer
  description: Specify a payment page's id to export only transactions conducted on said page.
  reason: Listed on the canonical Export Transactions section but absent from the spec. Confirmed against the Paystack test API on 2026-10-08, where it changes the exported rows.
  docs: https://paystack.com/docs/api/transaction/#export

- operation: "GET /bank"
  in: query
  wire: type
  spec: type
  enum: [ghipss, mobile_money, nuban, kepss, basa]
  reason: The spec lists the Ghana bank channel as ghipps, which is a typo. The canonical List Banks section says ghipss. Confirmed against the Paystack test API on 2026-10-09 with country=ghana&perPage=1, where type=ghipss returns banks and type=ghipps returns an empty list. kepss was checked the same way (kepss returns banks for Kenya, kepps returns none).
  docs: https://paystack.com/docs/api/miscellaneous/#bank

- operation: "GET /bank/resolve"
  in: query
  wire: account_number
  spec: account_number
  type: string
  required: true
  reason: The docs say account_number is a required string; the spec says an optional integer. An integer would lose the leading zero that account numbers carry. Confirmed against the Paystack test API on 2026-10-09, where omitting it returns 400 "account_number is required", and 0022728151 is read as a different account number from 22728151 (the latter returns 400 "Account number is invalid").
  docs: https://paystack.com/docs/api/verification/#resolve-account

- operation: "GET /bank/resolve"
  in: query
  wire: bank_code
  spec: bank_code
  type: string
  required: true
  reason: The docs say bank_code is a required string; the spec says an optional integer. Bank codes carry leading zeros (063). Confirmed against the Paystack test API on 2026-10-09, where omitting it returns 400 "bank_code is required".
  docs: https://paystack.com/docs/api/verification/#resolve-account

- operation: "GET /decision/bin/{bin}"
  in: path
  wire: bin
  spec: bin
  type: string
  reason: The docs say bin is a string; the spec says an integer. Confirmed against the Paystack test API on 2026-10-09, where /decision/bin/539983 resolves and a non-numeric value returns 400 "Bin must be 6 or 8 digits". A string keeps leading zeros.
  docs: https://paystack.com/docs/api/verification/#resolve-card

- operation: "GET /address_verification/states"
  in: query
  wire: country
  spec: country
  required: true
  reason: The docs mark country required; the spec marks it optional. Confirmed against the Paystack test API on 2026-10-09, where omitting it returns 422 "Country is required".
  docs: https://paystack.com/docs/api/miscellaneous/#avs-states

- operation: "GET /bank"
  in: query
  wire: currency
  spec: currency
  enum: [GHS, KES, NGN, ZAR, USD]
  reason: The spec lists four currencies; the SDK has always accepted USD as well. Confirmed against the Paystack test API on 2026-10-09, where currency=USD&country=ghana&perPage=1 returns a USD bank (Absa Bank Ghana Limited) while currency=XXX returns an empty list. The docs only say "one of the supported currency".
  docs: https://paystack.com/docs/api/miscellaneous/#bank

- operation: "POST /charge"
  in: body
  wire: currency
  spec: null
  type: string
  description: The currency to charge in (GHS, KES and so on); Paystack uses your integration's currency when it is left out.
  reason: Sent in the Mobile Money, M-PESA and EFT examples of Paystack's payment channels guide; absent from the spec and from the Create Charge parameter table. Confirmed against the Paystack test API on 2026-10-09 (a GHS integration), where a mobile_money charge with currency GHS succeeds and the same charge with KES or XYZ is refused with "Invalid provider".
  docs: https://paystack.com/docs/payments/payment-channels/#mobile-money

- operation: "POST /charge"
  in: body
  wire: split_code
  spec: null
  type: string
  description: The split code (SPL_...) of a previously created split.
  reason: Listed on the canonical Create Charge section but absent from the spec. Confirmed against the Paystack test API on 2026-10-09, where an unknown split code is refused with 404 "Invalid Split code.".
  docs: https://paystack.com/docs/api/charge/#create

- operation: "POST /charge"
  in: body
  wire: subaccount
  spec: null
  type: string
  description: The code (ACCT_...) of the subaccount that owns the payment.
  reason: Listed on the canonical Create Charge section but absent from the spec. Confirmed against the Paystack test API on 2026-10-09, where an unknown subaccount code is refused with 404 "Invalid Subaccount.".
  docs: https://paystack.com/docs/api/charge/#create

- operation: "POST /charge"
  in: body
  wire: bank_transfer
  spec: null
  type: object
  description: Settings for the Pay with Transfer and Pesalink channel (account_expires_at, the expiry time of the account).
  reason: Listed on the canonical Create Charge section but absent from the spec. Confirmed against the Paystack test API on 2026-10-09, where a charge with only a bank_transfer object returns status pending_bank_transfer (with no channel object at all, Paystack refuses the charge).
  docs: https://paystack.com/docs/api/charge/#create

- operation: "POST /charge"
  in: body
  wire: qr
  spec: null
  type: object
  description: The QR provider details (provider, scan-to-pay being the only one); South Africa only.
  reason: Listed on the canonical Create Charge section but absent from the spec. Confirmed against the Paystack test API on 2026-10-09, where a charge with only a qr object is attempted ("scan-to-pay QR payment not supported for this transaction" on a GHS integration) instead of being refused for lacking a channel object.
  docs: https://paystack.com/docs/api/charge/#create

- operation: "POST /charge"
  in: body
  wire: capitec_pay
  spec: null
  type: object
  description: The Capitec Pay account holder (identifier_key, one of CELLPHONE, IDNUMBER or ACCOUNTNUMBER, and identifier_value); South Africa only.
  reason: Listed on the canonical Create Charge section but absent from the spec. Confirmed against the Paystack test API on 2026-10-09, where a charge with only a capitec_pay object is refused with "Integration is not eligible for Capitec Pay" instead of for lacking a channel object.
  docs: https://paystack.com/docs/api/charge/#create

- operation: "GET /customer"
  in: query
  wire: perPage
  spec: perPage
  type: integer
  reason: Type only. Canonical docs list perPage as an Integer; the spec types it as a string. Confirmed against the Paystack test API on 2026-10-09, where perPage=2 returns two customers and meta.perPage 2.
  docs: https://paystack.com/docs/api/customer/#list

- operation: "GET /customer"
  in: query
  wire: page
  spec: page
  type: integer
  reason: Type only. Canonical docs list page as an Integer; the spec types it as a string. Confirmed against the Paystack test API on 2026-10-09, where page=2 returns the next set and meta.page 2.
  docs: https://paystack.com/docs/api/customer/#list

- operation: "POST /customer"
  in: body
  wire: metadata
  spec: metadata
  type: object
  description: A set of key/value pairs that you can attach to the customer.
  reason: Canonical docs list metadata as an Object; the spec says stringified JSON. Confirmed against the Paystack test API on 2026-10-09, which rejects a JSON string with 400 "\"metadata\" must be of type object" and stores an object as given.
  docs: https://paystack.com/docs/api/customer/#create

- operation: "PUT /customer/{code}"
  in: body
  wire: metadata
  spec: metadata
  type: object
  description: A set of key/value pairs that you can attach to the customer.
  reason: Canonical docs list metadata as an Object; the spec says stringified JSON. Confirmed against the Paystack test API on 2026-10-09, which rejects a JSON string with 400 "\"metadata\" must be of type object".
  docs: https://paystack.com/docs/api/customer/#update

- operation: "POST /refund"
  in: body
  wire: transaction
  spec: transaction
  description: The reference or ID of a previously completed transaction.
  reason: The spec says transaction is a reference string; the canonical Create Refund section says "Transaction reference or id" and its cURL sample sends an integer. Confirmed against the Paystack test API on 2026-10-09, where a reference, a numeric ID sent as a JSON integer and the same ID sent as a string all resolve the transaction (400 "Refund amount exceeds transaction amount" for an over-limit amount, against 400 "Transaction not found" for unknown values), and a full refund created with {"transaction":<integer id>} succeeded.
  docs: https://paystack.com/docs/api/refund/#create

- operation: "GET /refund"
  in: query
  wire: transaction
  spec: null
  type: integer
  ruby: transaction_id
  description: The ID of the refunded transaction.
  reason: Listed on the canonical List Refunds section ("The transaction ID of the refunded transaction") but absent from the spec. Confirmed against the Paystack test API on 2026-10-09 with refunds on two transactions, where transaction=<id> returned only that transaction's refund and transaction=<reference> returned none. The Ruby keyword is transaction_id because it takes the numeric ID, not a reference.
  docs: https://paystack.com/docs/api/refund/#list

- operation: "GET /settlement"
  in: query
  wire: from
  spec: null
  type: string
  description: A timestamp from which to start listing settlements, for example 2016-09-24T00:00:05.000Z or 2016-09-21.
  reason: Listed on the Settlements List section of the docs (via the docs mirror) but absent from the spec. Confirmed against the Paystack test API on 2026-10-09, which answers an invalid value with 400 "Invalid 'from' date passed" and accepts 2016-09-21, 2016-09-24T00:00:05.000Z and 2016-09-24T00:00:05Z. The test account has no settlements, so the filtering itself could not be observed.
  docs: https://paystack.com/docs/api/settlement/#list

- operation: "GET /settlement"
  in: query
  wire: to
  spec: null
  type: string
  description: A timestamp at which to stop listing settlements, for example 2016-09-24T00:00:05.000Z or 2016-09-21.
  reason: Listed on the Settlements List section of the docs (via the docs mirror) but absent from the spec. Confirmed against the Paystack test API on 2026-10-09, which answers an invalid value with 400 "Invalid 'to' date passed". The test account has no settlements, so the filtering itself could not be observed.
  docs: https://paystack.com/docs/api/settlement/#list

- operation: "GET /split"
  in: query
  wire: perPage
  spec: per_page
  reason: Canonical docs list perPage on List Splits; the spec says per_page. Confirmed against the Paystack test API on 2026-10-09 with two splits, where perPage=1 returns one split and meta.perPage 1, while per_page=1 is ignored (both splits, meta.perPage 50).
  docs: https://paystack.com/docs/api/split/#list

- operation: "GET /split/{id}"
  in: path
  wire: id
  spec: id
  type: string
  reason: The docs say id is a string; the spec says an integer. Confirmed against the Paystack test API on 2026-10-09, where /split/<numeric id> and /split/<split code> (SPL_...) both return the split. Only Fetch takes a split code; Update returns 500 and Add/Remove Subaccount return 400 "Split ID should be an integer" for one.
  docs: https://paystack.com/docs/api/split/#fetch

- operation: "POST /split/{id}/subaccount/add"
  in: body
  wire: subaccount
  spec: subaccount
  required: true
  reason: The docs list subaccount without "optional"; the spec marks it optional. Confirmed against the Paystack test API on 2026-10-09, where omitting it returns 400 "Please specify subaccount to be added".
  docs: https://paystack.com/docs/api/split/#add-subaccount

- operation: "POST /split/{id}/subaccount/add"
  in: body
  wire: share
  spec: share
  required: true
  reason: The docs list share without "optional"; the spec marks it optional. Confirmed against the Paystack test API on 2026-10-09, where omitting it returns 400 "You have invalid or missing subaccount(s) key".
  docs: https://paystack.com/docs/api/split/#add-subaccount

- operation: "POST /split/{id}/subaccount/remove"
  in: body
  wire: subaccount
  spec: subaccount
  required: true
  reason: The docs list subaccount without "optional"; the spec marks it optional. Confirmed against the Paystack test API on 2026-10-09, where omitting it returns 400 "Please specify subaccount to be removed".
  docs: https://paystack.com/docs/api/split/#remove-subaccount

- operation: "POST /split/{id}/subaccount/remove"
  in: body
  wire: share
  spec: share
  description: Not used when removing a subaccount; the docs do not list it, and Paystack removes the subaccount whatever share is sent.
  reason: Description only. The spec copies share from Add Subaccount; the docs list only subaccount. Confirmed against the Paystack test API on 2026-10-09, where removing a subaccount whose share was 30 with share 999 still returns "Subaccount removed".
  docs: https://paystack.com/docs/api/split/#remove-subaccount

- operation: "GET /dispute/{id}/upload_url"
  in: query
  wire: upload_filename
  spec: null
  type: string
  description: The file name, with its extension, that you want to upload (for example filename.pdf).
  reason: Listed on the canonical Get Upload URL section but absent from the spec. Confirmed against the Paystack test API on 2026-10-09, where it changes the response (upload_filename=a.pdf returned a signedUrl and fileName ending in .pdf; without it the file name has no extension).
  docs: https://paystack.com/docs/api/dispute/#upload-url
